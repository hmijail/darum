e governing permissions and limitations&amp;lt;/a&amp;gt;&amp;lt;br /&amp;gt;&amp;lt;a id=&amp;quot;L12&amp;quot;&amp;gt;12:  * under the License.&amp;lt;/a&amp;gt;&amp;lt;br /&amp;gt;&amp;lt;a id=&amp;quot;L13&amp;quot;&amp;gt;13:  */&amp;lt;/a&amp;gt;&amp;lt;br /&amp;gt;&amp;lt;a id=&amp;quot;L14&amp;quot;&amp;gt;14: include &amp;quot;../../libs/DafnyCrypto/src/dafny/util/option.dfy&amp;quot;&amp;lt;/a&amp;gt;&amp;lt;br /&amp;gt;&amp;lt;a id=&amp;quot;L15&amp;quot;&amp;gt;15: include &amp;quot;bytecode.dfy&amp;quot;&amp;lt;/a&amp;gt;&amp;lt;br /&amp;gt;&amp;lt;a id=&amp;quot;L16&amp;quot;&amp;gt;16: include &amp;quot;core/fork.dfy&amp;quot;&amp;lt;/a&amp;gt;&amp;lt;br /&amp;gt;&amp;lt;a id=&amp;quot;L17&amp;quot;&amp;gt;17: include &amp;quot;state.dfy&amp;quot;&amp;lt;/a&amp;gt;&amp;lt;br /&amp;gt;&amp;lt;a id=&amp;quot;L18&amp;quot;&amp;gt;18: include &amp;quot;opcodes.dfy&amp;quot;&amp;lt;/a&amp;gt;&amp;lt;br /&amp;gt;&amp;lt;a id=&amp;quot;L19&amp;quot;&amp;gt;19: include &amp;quot;gas.dfy&amp;quot;&amp;lt;/a&amp;gt;&amp;lt;br /&amp;gt;&amp;lt;a id=&amp;quot;L20&amp;quot;&amp;gt;20: &amp;lt;/a&amp;gt;&amp;lt;br /&amp;gt;&amp;lt;a id=&amp;quot;L21&amp;quot;&amp;gt;21: /**&amp;lt;/a&amp;gt;&amp;lt;br /&amp;gt;&amp;lt;a id=&amp;quot;L22&amp;quot;&amp;gt;22:  * Top-level definition of an Ethereum Virtual Machine.&amp;lt;/a&amp;gt;&amp;lt;br /&amp;gt;&amp;lt;a id=&amp;quot;L23&amp;quot;&amp;gt;23:  */&amp;lt;/a&amp;gt;&amp;lt;br /&amp;gt;&amp;lt;a id=&amp;quot;L24&amp;quot;&amp;gt;24: module EVM {&amp;lt;/a&amp;gt;&amp;lt;br /&amp;gt;&amp;lt;a id=&amp;quot;L25&amp;quot;&amp;gt;25:     import opened EvmState&amp;lt;/a&amp;gt;&amp;lt;br /&amp;gt;&amp;lt;a id=&amp;quot;L26&amp;quot;&amp;gt;26:     import opened Gas&amp;lt;/a&amp;gt;&amp;lt;br /&amp;gt;&amp;lt;a id=&amp;quot;L27&amp;quot;&amp;gt;27:     import opened Int&amp;lt;/a&amp;gt;&amp;lt;br /&amp;gt;&amp;lt;a id=&amp;quot;L28&amp;quot;&amp;gt;28:     import opened EvmFork&amp;lt;/a&amp;gt;&amp;lt;br /&amp;gt;&amp;lt;a id=&amp;quot;L29&amp;quot;&amp;gt;29:     import opened Opcode&amp;lt;/a&amp;gt;&amp;lt;br /&amp;gt;&amp;lt;a id=&amp;quot;L30&amp;quot;&amp;gt;30:     import opened Optional&amp;lt;/a&amp;gt;&amp;lt;br /&amp;gt;&amp;lt;a id=&amp;quot;L31&amp;quot;&amp;gt;31:     import Bytecode&amp;lt;/a&amp;gt;&amp;lt;br /&amp;gt;&amp;lt;a id=&amp;quot;L32&amp;quot;&amp;gt;32: &amp;lt;/a&amp;gt;&amp;lt;br /&amp;gt;&amp;lt;a id=&amp;quot;L33&amp;quot;&amp;gt;33:     /** An empty VM, with some initial gas and initial stack.&amp;lt;/a&amp;gt;&amp;lt;br /&amp;gt;&amp;lt;a id=&amp;quot;L34&amp;quot;&amp;gt;34:      *&amp;lt;/a&amp;gt;&amp;lt;br /&amp;gt;&amp;lt;a id=&amp;quot;L35&amp;quot;&amp;gt;35:      *  @param  gas     The gas loaded in this EVM.&amp;lt;/a&amp;gt;&amp;lt;br /&amp;gt;&amp;lt;a id=&amp;quot;L36&amp;quot;&amp;gt;36:      *  @returns        An ready-to-use EVM.&amp;lt;/a&amp;gt;&amp;lt;br /&amp;gt;&amp;lt;a id=&amp;quot;L37&amp;quot;&amp;gt;37:      */&amp;lt;/a&amp;gt;&amp;lt;br /&amp;gt;&amp;lt;a id=&amp;quot;L38&amp;quot;&amp;gt;38:     function Init(gas: nat, fork : Fork := BERLIN, stk: seq&amp;lt;u256&amp;gt; := [], code: seq&amp;lt;u8&amp;gt; := []) : (st:ExecutingState)&amp;lt;/a&amp;gt;&amp;lt;br /&amp;gt;&amp;lt;a id=&amp;quot;L39&amp;quot;&amp;gt;39:     requires |code| &amp;lt;= Code.MAX_CODE_SIZE&amp;lt;/a&amp;gt;&amp;lt;br /&amp;gt;&amp;lt;a id=&amp;quot;L40&amp;quot;&amp;gt;40:     requires |stk| &amp;lt;= 1024&amp;lt;/a&amp;gt;&amp;lt;br /&amp;gt;&amp;lt;a id=&amp;quot;L41&amp;quot;&amp;gt;41:     {&amp;lt;/a&amp;gt;&amp;lt;br /&amp;gt;&amp;lt;a id=&amp;quot;L42&amp;quot;&amp;gt;42:         var tx := Context.Create(0,0,0,0,[],true,0,Context.Block.Info(0,0,0,0,0,0,0));&amp;lt;/a&amp;gt;&amp;lt;br /&amp;gt;&amp;lt;a id=&amp;quot;L43&amp;quot;&amp;gt;43:         Create(fork, tx, map[0:=WorldState.DefaultAccount()], gas, code, Precompiled.DEFAULT, stk)&amp;lt;/a&amp;gt;&amp;lt;br /&amp;gt;&amp;lt;a id=&amp;quot;L44&amp;quot;&amp;gt;44:     }&amp;lt;/a&amp;gt;&amp;lt;br /&amp;gt;&amp;lt;a id=&amp;quot;L45&amp;quot;&amp;gt;45: &amp;lt;/a&amp;gt;&amp;lt;br /&amp;gt;&amp;lt;a id=&amp;quot;L46&amp;quot;&amp;gt;46:     /**&amp;lt;/a&amp;gt;&amp;lt;br /&amp;gt;&amp;lt;a id=&amp;quot;L47&amp;quot;&amp;gt;47:      * Create a fresh EVM to execute a given sequence of bytecode instructions.&amp;lt;/a&amp;gt;&amp;lt;br /&amp;gt;&amp;lt;a id=&amp;quot;L48&amp;quot;&amp;gt;48:      * The EVM is initialised with an empty stack and empty local memory.&amp;lt;/a&amp;gt;&amp;lt;br /&amp;gt;&amp;lt;a id=&amp;quot;L49&amp;quot;&amp;gt;49:      */&amp;lt;/a&amp;gt;&amp;lt;br /&amp;gt;&amp;lt;a id=&amp;quot;L50&amp;quot;&amp;gt;50:     function Create(fork: Fork, context: Context.T, world: map&amp;lt;u160,WorldState.Account&amp;gt;, gas: nat, code: seq&amp;lt;u8&amp;gt;, precompiled: Precompiled.T := Precompiled.DEFAULT, st: seq&amp;lt;u256&amp;gt; := []) : ExecutingState&amp;lt;/a&amp;gt;&amp;lt;br /&amp;gt;&amp;lt;a id=&amp;quot;L51&amp;quot;&amp;gt;51:     // Code to executed cannot exceed maximum limit.&amp;lt;/a&amp;gt;&amp;lt;br /&amp;gt;&amp;lt;a id=&amp;quot;L52&amp;quot;&amp;gt;52:     requires |code| &amp;lt;= Code.MAX_CODE_SIZE&amp;lt;/a&amp;gt;&amp;lt;br /&amp;gt;&amp;lt;a id=&amp;quot;L53&amp;quot;&amp;gt;53:     requires |st| &amp;lt;= Stack.CAPACITY&amp;lt;/a&amp;gt;&amp;lt;br /&amp;gt;&amp;lt;a id=&amp;quot;L54&amp;quot;&amp;gt;54:     // Account under which EVM is executing must exist!&amp;lt;/a&amp;gt;&amp;lt;br /&amp;gt;&amp;lt;a id=&amp;quot;L55&amp;quot;&amp;gt;55:     requires context.address in world {&amp;lt;/a&amp;gt;&amp;lt;br /&amp;gt;&amp;lt;a id=&amp;quot;L56&amp;quot;&amp;gt;56:         var stck := Stack.Make(st);&amp;lt;/a&amp;gt;&amp;lt;br /&amp;gt;&amp;lt;a id=&amp;quot;L57&amp;quot;&amp;gt;57:         var mem := Memory.Create();&amp;lt;/a&amp;gt;&amp;lt;br /&amp;gt;&amp;lt;a id=&amp;quot;L58&amp;quot;&amp;gt;58:         var tstore := TransientStorage.Create();&amp;lt;/a&amp;gt;&amp;lt;br /&amp;gt;&amp;lt;a id=&amp;quot;L59&amp;quot;&amp;gt;59:         var wld := WorldState.Create(world);&amp;lt;/a&amp;gt;&amp;lt;br /&amp;gt;&amp;lt;a id=&amp;quot;L60&amp;quot;&amp;gt;60:         var cod := Code.Create(code);&amp;lt;/a&amp;gt;&amp;lt;br /&amp;gt;&amp;lt;a id=&amp;quot;L61&amp;quot;&amp;gt;61:         var sub := SubState.Create();&amp;lt;/a&amp;gt;&amp;lt;br /&amp;gt;&amp;lt;a id=&amp;quot;L62&amp;quot;&amp;gt;62:         var evm := EVM(fork,stack:=stck,memory:=mem,transient:=tstore,world:=wld,context:=context,precompiled:=precompiled,code:=cod,substate:=sub,gas:=gas,pc:=0);&amp;lt;/a&amp;gt;&amp;lt;br /&amp;gt;&amp;lt;a id=&amp;quot;L63&amp;quot;&amp;gt;63:         // Off we go!&amp;lt;/a&amp;gt;&amp;lt;br /&amp;gt;&amp;lt;a id=&amp;quot;L64&amp;quot;&amp;gt;64:         EXECUTING(evm)&amp;lt;/a&amp;gt;&amp;lt;br /&amp;gt;&amp;lt;a id=&amp;quot;L65&amp;quot;&amp;gt;65:     }&amp;lt;/a&amp;gt;&amp;lt;br /&amp;gt;&amp;lt;a id=&amp;quot;L66&amp;quot;&amp;gt;66: &amp;lt;/a&amp;gt;&amp;lt;br /&amp;gt;&amp;lt;a id=&amp;quot;L67&amp;quot;&amp;gt;67:     /**&amp;lt;/a&amp;gt;&amp;lt;br /&amp;gt;&amp;lt;a id=&amp;quot;L68&amp;quot;&amp;gt;68:      * Execute the next bytecode as determined by the current machine&amp;#x27;s state.&amp;lt;/a&amp;gt;&amp;lt;br /&amp;gt;&amp;lt;a id=&amp;quot;L69&amp;quot;&amp;gt;69:      * This requires decoding the bytecode at the current PC location.&amp;lt;/a&amp;gt;&amp;lt;br /&amp;gt;&amp;lt;a id=&amp;quot;L70&amp;quot;&amp;gt;70:      */&amp;lt;/a&amp;gt;&amp;lt;br /&amp;gt;&amp;lt;a id=&amp;quot;L71&amp;quot;&amp;gt;71:     function Execute(st: ExecutingState): State {&amp;lt;/a&amp;gt;&amp;lt;br /&amp;gt;&amp;lt;a id=&amp;quot;L72&amp;quot;&amp;gt;72:         // Read opcode byte from memory.  If the read is out-of-bounds, then&amp;lt;/a&amp;gt;&amp;lt;br /&amp;gt;&amp;lt;a id=&amp;quot;L73&amp;quot;&amp;gt;73:         // STOP is returned by default.&amp;lt;/a&amp;gt;&amp;lt;br /&amp;gt;&amp;lt;a id=&amp;quot;L74&amp;quot;&amp;gt;74:         var opcode := Code.DecodeUint8(st.evm.code,st.evm.pc as nat);&amp;lt;/a&amp;gt;&amp;lt;br /&amp;gt;&amp;lt;a id=&amp;quot;L75&amp;quot;&amp;gt;75:         // Check fork supports given bytecode&amp;lt;/a&amp;gt;&amp;lt;br /&amp;gt;&amp;lt;a id=&amp;quot;L76&amp;quot;&amp;gt;76:         if st.evm.fork.IsBytecode(opcode)&amp;lt;/a&amp;gt;&amp;lt;br /&amp;gt;&amp;lt;a id=&amp;quot;L77&amp;quot;&amp;gt;77:         then&amp;lt;/a&amp;gt;&amp;lt;br /&amp;gt;&amp;lt;a id=&amp;quot;L78&amp;quot;&amp;gt;78:             // Deduct gas for the given bytecode.&amp;lt;/a&amp;gt;&amp;lt;br /&amp;gt;&amp;lt;a id=&amp;quot;L79&amp;quot;&amp;gt;79:             match DeductGas(opcode,st)&amp;lt;/a&amp;gt;&amp;lt;br /&amp;gt;&amp;lt;a id=&amp;quot;L80&amp;quot;&amp;gt;80:                 // Not out of gas&amp;lt;/a&amp;gt;&amp;lt;br /&amp;gt;&amp;lt;a id=&amp;quot;L81&amp;quot;&amp;gt;81:                 case EXECUTING(vm) =&amp;gt; ExecuteBytecode(opcode,EXECUTING(vm))&amp;lt;/a&amp;gt;&amp;lt;br /&amp;gt;&amp;lt;a id=&amp;quot;L82&amp;quot;&amp;gt;82:                 // Out of gas (or invalid opcode)&amp;lt;/a&amp;gt;&amp;lt;br /&amp;gt;&amp;lt;a id=&amp;quot;L83&amp;quot;&amp;gt;83:                 case s =&amp;gt; s&amp;lt;/a&amp;gt;&amp;lt;br /&amp;gt;&amp;lt;a id=&amp;quot;L84&amp;quot;&amp;gt;84:         else&amp;lt;/a&amp;gt;&amp;lt;br /&amp;gt;&amp;lt;a id=&amp;quot;L85&amp;quot;&amp;gt;85:             ERROR(INVALID_OPCODE)&amp;lt;/a&amp;gt;&amp;lt;br /&amp;gt;&amp;lt;a id=&amp;quot;L86&amp;quot;&amp;gt;86:     }&amp;lt;/a&amp;gt;&amp;lt;br /&amp;gt;&amp;lt;a id=&amp;quot;L87&amp;quot;&amp;gt;87: &amp;lt;/a&amp;gt;&amp;lt;br /&amp;gt;&amp;lt;a id=&amp;quot;L88&amp;quot;&amp;gt;88:     /**&amp;lt;/a&amp;gt;&amp;lt;br /&amp;gt;&amp;lt;a id=&amp;quot;L89&amp;quot;&amp;gt;89:      *  Execute the next instruction&amp;lt;/a&amp;gt;&amp;lt;br /&amp;gt;&amp;lt;a id=&amp;quot;L90&amp;quot;&amp;gt;90:      *  return&amp;lt;/a&amp;gt;&amp;lt;br /&amp;gt;&amp;lt;a id=&amp;quot;L91&a ch from JS for known C ids inside the shadowDOMs. (Panel issue 7443) \nThis is done with xfind. */\n\n/**\n * @description Locates the first matching elements on the page, even within shadow DOMs, using a complex n-depth selector.\n * Author: Roland Ross L. Hadi\n * GitHub: https://github.com/rolandhadi/shadow-dom-selector\n */\nfunction xfind(e,t=document){const o=performQuery(e,!1,t);return console.log(`Found ${o?1:0} element(s)`),o}function xfindAll(e,t=document){const o=performQuery(e,!0,t);return console.log(`Found ${o.length} element(s)`),o}function performQuery(e,t,o){validateSelector(e);const n=e.split(&amp;quot;&amp;gt;&amp;gt;&amp;gt;&amp;quot;);let r=o;for(let e=0;e&amp;lt;n.length;e++){if(e===n.length-1&amp;amp;&amp;amp;t)return querySelectorAllXFind(n[e],r);if(r=querySelectorXFind(n[e],r),null===r)return console.error(`Selector ${n[e]} not found`),t?[]:null}return r}function querySelectorAllXFind(e,t=document){return queryInShadowDOM(e,!0,t)}function querySelectorXFind(e,t=document){return queryInShadowDOM(e,!1,t)}function queryInShadowDOM(e,t,o){let n=o.querySelector(e);if(document.head.createShadowRoot||document.head.attachShadow){if(!t&amp;amp;&amp;amp;n)return n;return splitByUnquotedCharacter(e,&amp;quot;,&amp;quot;).reduce(((e,n)=&amp;gt;{if(!t&amp;amp;&amp;amp;e)return e;const r=splitByUnquotedCharacter(n.trim().replace(/\\s*([&amp;gt;+~])\\s*/g,&amp;quot;$1&amp;quot;),&amp;quot; &amp;quot;).filter(Boolean),l=r.length-1,u=gatherAllElementsXFind(r[l],o),s=matchElements(r,l,o);return t?e.concat(u.filter(s)):u.find(s)||null}),t?[]:null)}return t?o.querySelectorAll(e):n}function matchElements(e,t,o){return n=&amp;gt;{let r=t,l=n;for(;l;){const t=!!l.matches&amp;amp;&amp;amp;l.matches(e[r]);if(t&amp;amp;&amp;amp;0===r)return!0;t&amp;amp;&amp;amp;r--,l=getParentOrHost(l,o)}return!1}}function splitByUnquotedCharacter(e,t){return e.match(/\\\\?.|^$/g).reduce(((e,o)=&amp;gt;(&amp;#x27;&amp;quot;&amp;#x27;!==o||e.singleQuote?&amp;quot;&amp;#x27;&amp;quot;!
